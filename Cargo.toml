[package]
exclude = ["/registration/**", "/state/**", "/.local/**", "/.state/**", "/.data/**", "/secrets/**", "/credentials/**", "/.env", "/.env.production", "/.env.local", "/*.tgz", "/*.tar.gz", "/*.tar", "/*.zip", "/*.whl", "/*.crate", "/.ruff_cache/**", "/.mypy_cache/**", "/.tox/**", "/.nox/**", "/.hypothesis/**", "/.coverage", "/.coverage.*", "/htmlcov/**", "/lcov.info", "/junit.xml", "/*.profraw", "/*.profdata", "/*.egg-info/**", "/target/**", "/node_modules/**", "/dist/**", "/build/**", "/.cache/**", "/.pytest_cache/**", "/coverage/**"]
name = "hat-local-inference-manager"
version = "0.10.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
publish = false

[[bin]]
name = "hat-local-inference-manager-worker"
path = "src/main.rs"

[dependencies]
hat-specifications = { version = "=0.10.0" }
hex = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
zixcel-local-inference = { version = "=0.11.0" }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"

# One current source identity across direct and transitive operational contracts.
[patch.crates-io]
hat-specifications = { git = "https://github.com/hathq/hat-specifications", rev = "8123222df96a289e4f4a4aa0c605b94b1905a60b" }
