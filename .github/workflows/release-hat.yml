name: Build and release public HAT
on:
  pull_request:
  push:
    branches: [main]
    tags: ['hat/v*']
permissions:
  contents: read
concurrency:
  group: hat-release-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python3 .github/hat-release/test_release.py
      - run: rustup toolchain install 1.97.1 --profile minimal
      - run: cargo +1.97.1 test --locked --all-targets
      - run: cargo +1.97.1 build --locked --release --bins
      - name: Assemble source-bound Linux distribution
        run: |
          HAT_BINARY=$(python3 -c 'import json; print(json.load(open(".github/hat-release.json"))["binary"])')
          python3 .github/hat-release/prepare.py "$RUNNER_TEMP/hat-release" "target/release/$HAT_BINARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        id: upload
        with:
          name: hat-release-${{ github.sha }}
          path: ${{ runner.temp }}/hat-release/
          if-no-files-found: error
          retention-days: 14
  publish:
    if: github.event_name == 'push' && github.ref_type == 'tag' && github.event.repository.private == false && vars.HAT_RELEASE_ENABLED == 'true'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: hat-public
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: ${{ runner.temp }}/hat-release
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          subject-path: ${{ runner.temp }}/hat-release/*
      - name: Verify owner, tag, protected approval and bytes, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          HAT_RELEASE_DIRECTORY: ${{ runner.temp }}/hat-release
        run: python3 .github/hat-release/publish.py
